<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户注册</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <div class="container">
        <h1>用户注册</h1>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="username">用户名</label>
                <input id="username" name="username" type="text" placeholder="请输入用户名" required />
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" placeholder="请输入密码" required />
            </div>

            <div class="form-group">
                <label for="name">姓名</label>
                <input id="name" name="name" type="text" placeholder="请输入姓名" />
            </div>

            <div class="form-group">
                <label for="email">邮箱</label>
                <input id="email" name="email" type="email" placeholder="请输入邮箱" />
            </div>

            <div class="form-group">
                <label for="phone">手机号</label>
                <input id="phone" name="phone" type="text" placeholder="请输入手机号" />
            </div>

            <button type="submit">注册</button>
        </form>

        <div id="resultBox" class="result-box hidden"></div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
